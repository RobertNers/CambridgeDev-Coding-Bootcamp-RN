<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Own Adventure</title>
  <link rel="stylesheet" href="cyoa.css">
  <script src="story.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <div class="content">
    
    <div class="left-bar" id="leftBar">
      <a class="left-bar__title" href="cyoa.html"><div>CYOA Project v0.1</div>
      <a class="left-bar__button" href="../../index.html"><button>Home</button></a>
      <button class="left-bar__button" id="buttonTheme">Toggle Dark Mode</button>
      <button class="left-bar__button" id="buttonHelp">Help</button>
      <button class="left-bar__button" id="buttonUndo">Undo</button>
      <div class="left-bar__text">Your Class:
        <p id="classDisplay">Aimless Soul</p>
        </div>
      <div class="left-bar__image-box"><img class="left-bar__image" id="sceneImage"></div>
      <div class="left-bar__spacer"></div>
      <div class="left-bar__text left-bar__bottom">Times Completed:
        <p id="timesFinished"></p></div>
    </div>

    <div class="play-area">

      <div class="story-box"><p id="storyText"></p></div>

      <div class="choice-box">
        <button id="choiceOne"></button>
        <button id="choiceTwo"></button>
        <button id="choiceThree"></button>
      </div>

    </div>

  </div>
</body>
</html>

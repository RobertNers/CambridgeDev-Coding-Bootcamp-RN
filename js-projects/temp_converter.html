<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="temp_converter.css">
  <script src="temp_converter.js" defer></script>
</head>
<body>

  <div class="content">

    <h1>Temperature Converter</h1>
    <a href="../index.html">Back to home page</a>

    <div class="converter">
      <input id="temp-input" class="converter__box" placeholder="Temperature">

      <div class="converter__buttons">
        <button id="c-to-f" class="converter__button">C to F</button>
        <button id="f-to-c" class="converter__button">F to C</button>
      </div>

      <p id="output"></p>
    </div>

  </div>

</body>
</html>
